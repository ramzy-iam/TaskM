@if (loading) {
  <p-skeleton height="2rem" width="50%" borderRadius="5px" />
  <p-skeleton height="2.25rem" styleClass="mt-10" borderRadius="5px" />
  <p-skeleton height="2.25rem" styleClass="mt-8" borderRadius="5px" />
  <div class="grid grid-cols-2 gap-2">
    <p-skeleton height="2.25rem" styleClass="mt-8" borderRadius="5px" />
    <p-skeleton height="2.25rem" styleClass="mt-8" borderRadius="5px" />
  </div>
  <p-skeleton height="2.25rem" styleClass="mt-8" borderRadius="5px" />
  <div class="grid grid-cols-2 gap-2">
    <p-skeleton height="2.25rem" styleClass="mt-8" borderRadius="5px" />
    <p-skeleton height="2.25rem" styleClass="mt-8" borderRadius="5px" />
  </div>
} @else {
  @if (linguist$ | async; as linguist) {
    <ng-container>
      <div
        class="flex sticky z-9 py-2 top-0 right-0 justify-end items-center bg-white"
      >
        <ui-close-button (click)="close()"></ui-close-button>
      </div>
      <div class="flex flex-col bg-white pb-2">
        <div class="flex flex-col mt-2 gap-y-4">
          <p-panel
            header="Details"
            [toggleable]="true"
            toggler="header"
            [expandIcon]="'pi pi-chevron-up'"
            [collapseIcon]="'pi pi-chevron-down'"
            [collapsed]="true"
          >
            <app-linguist-form
              class="flex flex-col gap-y-4 dpt-5 bg-white sticky z-9 top-10 pb-2"
              [linguist]="linguist"
              [autoSave]="true"
            ></app-linguist-form>
          </p-panel>
          <p-panel
            header="Competences"
            toggler="header"
            [toggleable]="true"
            [expandIcon]="'pi pi-chevron-up'"
            [collapseIcon]="'pi pi-chevron-down'"
          >
            <div class="my-4 flex flex-col gap-y-4">
              <div class="grid grid-cols-4">
                <p-button
                  class="col-span-1"
                  icon="pi pi-plus"
                  title="Add"
                  (click)="showCompetenceDialog()"
                />
              </div>
              <div>
                @for (competence of linguist.competences; track $index) {
                  <app-linguist-competence [competence]="competence" />
                }
              </div>
            </div>
          </p-panel>
        </div>
      </div>
    </ng-container>
  }
}
