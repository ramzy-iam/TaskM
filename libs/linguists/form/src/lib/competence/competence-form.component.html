@if (form) {
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    autocomplete="off"
    class="bg-white"
  >
    <div class="flex flex-col gap-x-4">
      <div class="grid grid-cols-2 gap-2">
        <div class="col-span-full pt-8">
          <p-floatLabel>
            <p-dropdown
              formControlName="code"
              [options]="availableTasks"
              optionLabel="name"
              optionValue="value"
              inputId="code"
              [editable]="true"
              [checkmark]="true"
              [showClear]="true"
            />
            <label for="code">Task</label>
          </p-floatLabel>
          <input-error
            [control]="form.get('code')!"
            [formGroup]="form"
            [fieldName]="'Task'"
          />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="col-span-full pt-8">
          <p-floatLabel>
            <p-dropdown
              formControlName="currency"
              [options]="currencies"
              optionLabel="name"
              optionValue="value"
              inputId="currency"
              [editable]="true"
              [checkmark]="true"
              [showClear]="true"
            />
            <label for="currency">Currency</label>
          </p-floatLabel>
          <input-error [control]="form.get('currency')!" [formGroup]="form" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="col-span-1 pt-8">
          <p-floatLabel>
            @if (form.get('currency')?.value) {
              <p-inputNumber
                inputId="rate"
                formControlName="rate"
                class="w-2"
                mode="currency"
                [currency]="
                  CurrencyToIntlNumberFormat[form.get('currency')?.value]
                "
                [locale]="
                  CurrencyToIntlNumberFormat[form.get('currency')?.value] ===
                  'XAF'
                    ? 'en-US'
                    : 'fr-CM'
                "
                [maxFractionDigits]="5"
              />
            } @else {
              <p-inputNumber
                inputId="rate"
                mode="decimal"
                [minFractionDigits]="0"
                [maxFractionDigits]="6"
                formControlName="rate"
                class="w-2"
              />
            }
            <label for="rate">Rate</label>
          </p-floatLabel>
          <input-error [control]="form.get('rate')!" [formGroup]="form" />
        </div>
        <div class="col-span-1 pt-8">
          <p-floatLabel>
            <p-dropdown
              formControlName="unit"
              [options]="loadUnits"
              optionLabel="name"
              optionValue="value"
              inputId="unit"
              [editable]="true"
              [checkmark]="true"
              [showClear]="true"
              appendTo="body"
            />
            <label for="unit">Unit</label>
          </p-floatLabel>
          <input-error [control]="form.get('unit')!" [formGroup]="form" />
        </div>
      </div>
    </div>
    <div class="mt-8 flex justify-center">
      <p-button
        type="submit"
        [label]="!competence.id ? 'Submit' : 'Update'"
        [loading]="loading"
        [disabled]="form.invalid"
      />
    </div>
  </form>
}
