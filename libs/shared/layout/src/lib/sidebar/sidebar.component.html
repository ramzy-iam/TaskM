<aside
  class="flex flex-col fixed top-0 left-0 bottom-0 min-w-[280px] bg-neutral-95 py-10"
>
  <nav class="mt-24 flex flex-col">
    <a
      [routerLink]="[link.link]"
      *ngFor="let link of links"
      class="flex items-center px-10 mb-8 font-medium group"
      routerLinkActive="group is-active"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <div
        class="w-10 h-10 rounded-full border border-secondary-borders flex justify-center items-center mr-4 group-[.is-active]:text-white group-[.is-active]:bg-primary-color text-accent-base group-hover:bg-primary-color group-hover:text-white transition-all duration-300 ease-in-out"
      >
        <ng-icon [name]="link.icon"></ng-icon>
      </div>
      <span>{{ link.label }}</span>
    </a>
  </nav>
</aside>
