<div>
  <p-toast />
  <app-header (toggleSidebarEvent)="toggleSidebar()"></app-header>
  <div class="pt-16 flex overflow-hidden">
    <app-sidebar [isOpen]="isSidebarOpen"></app-sidebar>
    <div
      class="h-full w-full overflow-y-auto relative transition-all duration-300 ease-linear"
      [ngClass]="{
        'ml-64': isSidebarOpen,
        'ml-12': !isSidebarOpen,
      }"
    >
      <main class="h-[calc(100vh-64px)] max-h-[calc(100vh-64px)]">
        <div
          [ngClass]="{
            'px-3': isSidebarOpen,
            'px-2': !isSidebarOpen,
          }"
        >
          <div class="flex">
            <div
              class="flex flex-col flex-shrink-0 flex-grow basis-0 overflow-hidden"
            >
              <div
                class="flex flex-col pb-5 px-10 bg-white overflow-hidden h-[calc(100vh-64px)] max-h-[calc(100vh-64px)]"
              >
                <router-outlet></router-outlet>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
