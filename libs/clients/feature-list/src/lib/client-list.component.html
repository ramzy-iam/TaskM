<div class="h-full gap-0 grid grid-rows-4 mt-4">
  <app-section-header>
    <div>
      <div class="py-8 bg-white border-b border-gray">
        <div class="flex flex-col gap-8">
          <div class="flex justify-between items-center">
            <div class="flex">
              <h1 class="text-[24px] text-black-2 font-semibold">Clients</h1>
            </div>
            <p-button label="Add client" (onClick)="showCreateDialog()" />
          </div>
          <div>
            <form [formGroup]="searchForm">
              <ui-input-search
                [control]="searchForm.controls.query"
                [attributes]="{ placeholder: 'Search' }"
              />
            </form>
          </div>
        </div>
      </div>
    </div>
  </app-section-header>
  <div
    class="grid grid-cols-3 h-auto max-w-full max-h-full row-span-3 overflow-hidden"
  >
    <div
      class="relative w-full h-full- max-h-full pr-8 overflow-auto bg-white mb-2"
      [ngClass]="{
        'col-span-2': selectedClientCode,
        'col-span-full': !selectedClientCode,
      }"
    >
      @if (loading) {
        <div class="grid grid-cols-3 gap-10">
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
        </div>
        <div class="grid grid-cols-3 gap-10 mt-10">
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
        </div>
        <div class="grid grid-cols-3 gap-10 mt-8">
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
        </div>
        <div class="grid grid-cols-3 gap-10 mt-8">
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
          <p-skeleton height="2.25rem" borderRadius="5px" />
        </div>
      } @else {
        @if (clients$ | async; as clients) {
          <ui-list-item class="sticky top-0 z-1 bg-white">
            <div class="grid grid-cols-2 text-black/95 font-semibold">
              <div class="grid-cols-1">Name</div>
              <div class="grid-cols-1">Code</div>
            </div>
          </ui-list-item>
          <div class="h-full w-full">
            @for (client of clients; track client.id; let i = $index) {
              <a
                routerLink="."
                [queryParams]="{ selectedClient: client.code }"
                #rla="routerLinkActive"
                routerLinkActive
                [routerLinkActiveOptions]="{ exact: true }"
                class="block relative hover:border-primary hover:border-[1.4px]"
              >
                <ui-list-item [isSelected]="rla.isActive">
                  <div class="grid grid-cols-2 items-center">
                    <div class="grid-cols-1">{{ client.name }}</div>
                    <div class="grid-cols-1">{{ client.code }}</div>
                  </div>
                </ui-list-item>
              </a>
            }
          </div>
        }
      }
    </div>
    @if (selectedClientCode) {
      <div
        class="relative h-full- max-h-full pb-3 px-8 m-1 mb-2 bg-white overflow-x-auto overflow-y-scroll"
      >
        <div
          class="flex sticky z-9 top-0 right-0 justify-end items-center bg-white"
        >
          <span
            title="close"
            (click)="closeChild()"
            class="self-end p-2 flex justify-end items-end cursor-pointer"
          >
            <ng-icon name="radixCross2" size="25"></ng-icon>
          </span>
        </div>
        <div class="flex flex-col bg-white pb-2">
          <app-client-details
            (clientNotFound)="closeChild()"
            [code]="selectedClientCode"
          ></app-client-details>
        </div>
      </div>
    }
  </div>
</div>
