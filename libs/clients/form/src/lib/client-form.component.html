@if (form) {
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    autocomplete="off"
    class="bg-white"
  >
    <div class="flex flex-col gap-x-4">
      <div class="grid grid-cols-2">
        <div class="col-span-full pt-8">
          <p-floatLabel>
            <input
              id="name"
              type="text"
              pInputText
              class="w-full"
              formControlName="name"
            />
            <label for="name">Name</label>
          </p-floatLabel>
          <input-error [control]="form.get('name')!" [formGroup]="form" />
        </div>
      </div>
      <div class="grid grid-cols-2">
        <div class="col-span-full pt-8">
          <p-floatLabel>
            <input
              id="code"
              type="text"
              pInputText
              class="w-full"
              formControlName="code"
            />
            <label for="code">Code</label>
          </p-floatLabel>
          <input-error [control]="form.get('code')!" [formGroup]="form" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="col-span-1 pt-8">
          <p-floatLabel>
            <p-dropdown
              formControlName="currency"
              [options]="currencies"
              optionLabel="name"
              optionValue="value"
              inputId="currency"
              [editable]="true"
              [checkmark]="true"
              [showClear]="true"
            />
            <label for="currency">Currency</label>
          </p-floatLabel>
          <input-error [control]="form.get('currency')!" [formGroup]="form" />
        </div>
        <div class="col-span-1 pt-8">
          <p-floatLabel>
            <p-dropdown
              formControlName="paymentMethod"
              [options]="paymentMethods"
              optionLabel="name"
              optionValue="value"
              inputId="paymentMethod"
              [editable]="true"
              [checkmark]="true"
              [showClear]="true"
            />
            <label for="paymentMethod">Payment Method</label>
          </p-floatLabel>
          <input-error
            [control]="form.get('paymentMethod')!"
            [formGroup]="form"
          />
        </div>
      </div>
      <div class="grid grid-cols-2">
        <div class="col-span-full pt-8">
          <p-floatLabel>
            <input
              id="billingEmailAddress"
              type="text"
              pInputText
              class="w-full"
              formControlName="billingEmailAddress"
              placeholder="Email"
            />
            <label for="billingEmailAddress">Billing Address</label>
          </p-floatLabel>
          <input-error
            [control]="form.get('billingEmailAddress')!"
            [formGroup]="form"
          />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="col-span-1 pt-8">
          <p-floatLabel>
            <input
              id="billingPeriod"
              type="text"
              pInputText
              class="w-full"
              formControlName="billingPeriod"
            />
            <label for="billingPeriod">Billing Period</label>
          </p-floatLabel>
          <input-error
            [control]="form.get('billingPeriod')!"
            [formGroup]="form"
          />
        </div>
        <div class="col-span-1 pt-8">
          <p-floatLabel>
            <p-inputNumber
              inputId="paymentDueDays"
              formControlName="paymentDueDays"
              prefix="Pay after "
              suffix=" days"
              class="w-2"
            />
            <label for="paymentDueDays">Payment Due Days</label>
          </p-floatLabel>
          <input-error
            [control]="form.get('paymentDueDays')!"
            [formGroup]="form"
          />
        </div>
      </div>
    </div>
    @if (!autoSave) {
      <div class="mt-8 flex justify-center">
        <p-button
          type="submit"
          [label]="!client ? 'Create client' : 'Update client'"
          [loading]="loading"
          [disabled]="form.invalid"
        />
      </div>
    }
  </form>
}
